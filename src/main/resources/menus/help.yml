# ╔═══════════════════════════════════════════════════════════════════════════╗
# ║                            AnyHomes Help Layout                           ║
# ╚═══════════════════════════════════════════════════════════════════════════╗
#
# This file configures the help menu layout.
#
# ╔═══════════════════════════════════════════════════════════════════════════╗

title: "<reset><gradient:#ff5f6d:#ffc371><bold>✦ Help & Commands ✦</bold></gradient>"
rows: 4

filler:
  enabled: true
  material: GRAY_STAINED_GLASS_PANE
  hide-details: true
  item_flags:
    - HIDE_ADDITIONAL_TOOLTIP

items:
  header:
    slot: 4
    material: WRITABLE_BOOK
    display-name: "<reset><gradient:#ff5f6d:#ffc371><bold>✦ Help & Commands ✦</bold></gradient>"
    lore:
      - "<reset><gray>Learn how to use AnyHomes commands."
      - "<reset><gray>All commands are listed below."
    action: NONE

  sethome:
    slot: 10
    material: OAK_SIGN
    display-name: "<reset><gradient:#ff5f6d:#ffc371><bold>/sethome [name]</bold></gradient>"
    lore:
      - "<reset><gray>Sets your current location as a home."
      - "<reset><gray>If no name is provided, uses 'home'."
      - "<reset><dark_gray>Example: <white>/sethome myhome</white>"
    action: NONE

  home:
    slot: 11
    material: COMPASS
    display-name: "<reset><gradient:#ff5f6d:#ffc371><bold>/home [name]</bold></gradient>"
    lore:
      - "<reset><gray>Teleports you to a saved home."
      - "<reset><gray>If no name is provided, uses 'home'."
      - "<reset><dark_gray>Example: <white>/home myhome</white>"
    action: NONE

  delhome:
    slot: 12
    material: FLINT_AND_STEEL
    display-name: "<reset><gradient:#ff5f6d:#ffc371><bold>/delhome <name></bold></gradient>"
    lore:
      - "<reset><gray>Deletes a saved home."
      - "<reset><dark_gray>Example: <white>/delhome myhome</white>"
    action: NONE

  homes:
    slot: 13
    material: ENDER_CHEST
    display-name: "<reset><gradient:#ff5f6d:#ffc371><bold>/homes</bold></gradient>"
    lore:
      - "<reset><gray>Opens the homes menu to manage your homes."
      - "<reset><gray>You can teleport, delete, or rename homes here."
    action: NONE

  back:
    slot: 31
    material: FEATHER
    display-name: "<reset><gradient:#ff5f6d:#ffc371><bold>Back to Homes</bold></gradient>"
    lore:
      - "<reset><gray>Return to the homes menu."
    action: BACK_TO_HOMES

  close:
    slot: 35
    material: REDSTONE
    display-name: "<reset><#ff5f6d><bold>Close Menu</bold></#ff5f6d>"
    lore:
      - "<reset><gray>Close this menu."
    action: CLOSE