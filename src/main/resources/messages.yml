# ╔═══════════════════════════════════════════════════════════════════════════╗
# ║                      AnyHomes — messages.yml Tutorial                     ║
# ╚═══════════════════════════════════════════════════════════════════════════╝
#
# Welcome to the AnyHomes message configuration!
# Below is a detailed guide on how to configure your chat, title, and action bar messages.
#
# ─── Color Formatting Options ──────────────────────────────────────────────
# You can use any of the following color formats in any message:
#
# 1. MiniMessage / Adventure Format:
#    - Named Colors:   <red>Message</red>, <gold>Message</gold>
#    - Custom Hex:     <#ff0000>Message</#ff0000>
#    - Gradients:      <gradient:#ff5f6d:#ffc371><bold>Glow Message</bold></gradient>
#    - Decorative:     <bold>, <italic>, <underlined>, <strikethrough>, <obfuscated>, <reset>
#
# 2. Legacy Alternate Codes (&):
#    - Standard:       &7Message, &aMessage, &c&lBold Red Message
#    - Legacy Hex:     &#ff0000Message
#
# 3. Standard Legacy Codes (§):
#    - Standard:       §7Message, §aMessage
#    - Standard Hex:   §#ff0000Message
#
# 4. Raw Hex Codes (#):
#    - Standard:       #ff0000Red Message
#
# ╔═══════════════════════════════════════════════════════════════════════════╗

# ─── Prefix ──────────────────────────────────────────────────────────────────
prefix: "<dark_gray>● </dark_gray><gradient:#ff5f6d:#ffc371><bold>AnyHomes</bold></gradient> <dark_gray>»</dark_gray> "

# ─── General ─────────────────────────────────────────────────────────────────
general:
  no-permission:     "<prefix><#ff5f6d>You do not have permission to execute this action."
  player-only:       "<prefix><#ff5f6d>This command can only be executed by players."
  unknown-command:   "<prefix><gray>Unknown command. Try <gradient:#ff5f6d:#ffc371>/anyhomes</gradient> for help."
  error:             "<prefix><#ff5f6d>An internal error occurred. Please contact administration."

# ─── Home ────────────────────────────────────────────────────────────────────
home:
  # /sethome
  set:             "<prefix><gray>Home <gradient:#ff5f6d:#ffc371><bold><home></bold></gradient> has been successfully set!"
  set-failed:      "<prefix><#ff5f6d>Failed to save your home. Please try again."
  invalid-name:    "<prefix><#ff5f6d>Invalid home name. Use only alphanumeric characters, <gray>-</gray> and <gray>_</gray> (max 32 chars)."
  limit-reached:   "<prefix><#ff5f6d>You have reached your home limit <gray>(max <gradient:#ff5f6d:#ffc371><limit></gradient> homes)</gray>."
  rename.prompt:   "<prefix><gray>Please type the new name for <gradient:#ff5f6d:#ffc371><home></gradient> in chat, or type <#ff5f6d>cancel</#ff5f6d> to abort."
  rename.success:  "<prefix><gray>Home <gradient:#ff5f6d:#ffc371><old></gradient> has been renamed to <gradient:#ff5f6d:#ffc371><new></gradient>."
  rename.exists:   "<prefix><#ff5f6d>A home with that name already exists. Pick a different name."
  rename.cancelled: "<prefix><gray>Home rename cancelled."
  rename.nochange:  "<prefix><gray>The home name remains unchanged." 

  # /home
  not-found:       "<prefix><#ff5f6d>Home <gray><home></gray> was not found."
  teleported:      "<prefix><gray>Teleported to home <gradient:#ff5f6d:#ffc371><bold><home></bold></gradient>."
  teleport-failed: "<prefix><#ff5f6d>Teleportation failed. Is the target world loaded?"

  warmup-start:    "<prefix><gray>Stand still for <gradient:#ff5f6d:#ffc371><bold><seconds>s</bold></gradient> to teleport to <gradient:#ff5f6d:#ffc371><home></gradient>..."
  warmup-cancelled: "<prefix><#ff5f6d>Teleportation cancelled — you moved!"

  cooldown:        "<prefix><#ff5f6d>You must wait <gradient:#ff5f6d:#ffc371><seconds>s</gradient> before teleporting again."

  # /delhome
  deleted:         "<prefix><gray>Home <gradient:#ff5f6d:#ffc371><home></gradient> has been deleted."
  delhome-usage:   "<prefix><gray>Usage: <white>/delhome <name></white>"

  # /list
  list-empty:      "<prefix><gray>You have no homes set. Use <white>/sethome [name]</white> to create one."
  list-header:     "<newline><gradient:#ff5f6d:#ffc371>━━━ Your Homes (<count>) ━━━</gradient>"
  list-entry:      " <dark_gray>▸</dark_gray> <gradient:#ff5f6d:#ffc371><home></gradient> <dark_gray>| <gray><world> <dark_gray>(<coords>)</dark_gray>"

# ─── Admin ───────────────────────────────────────────────────────────────────
admin:
  usage: |
    <gradient:#ff5f6d:#ffc371>━━━ AnyHomes Admin ━━━</gradient>
    <gray>▸ /anyhomes reload</gray>
    <gray>▸ /homes <player>:<home> or /homes <player>:</gray>
    <gray>▸ /delhomes <player>:<home></gray>
    <gray>▸ /sethomes <player>:<home></gray>
  reloaded:          "<prefix><green>Configuration and menus reloaded successfully."
  player-not-found:  "<prefix><#ff5f6d>Player <gradient:#ff5f6d:#ffc371><player></gradient> not found."
  home-deleted:      "<prefix><green>Deleted home <gradient:#ff5f6d:#ffc371><home></gradient> for <white><player></white>."
  home-set:          "<prefix><green>Home <gradient:#ff5f6d:#ffc371><home></gradient> has been set for <white><player></white>."
  home-not-found:    "<prefix><#ff5f6d>Player <gradient:#ff5f6d:#ffc371><player></gradient> has no home named <white><home></white>."
  delhomes-usage:    "<prefix><gray>Usage: <white>/delhomes <player>:<home></white>"
  sethomes-usage:    "<prefix><gray>Usage: <white>/sethomes <player>:<home></white>"
  player-no-homes:   "<prefix><gray>Player <white><player></white> has no homes set."
  player-homes-header: "<newline><gradient:#ff5f6d:#ffc371>━━━ Homes of <player> (<count>) ━━━</gradient>"
  teleported-to-home: "<prefix><gray>Teleported to <gradient:#ff5f6d:#ffc371><bold><home></bold></gradient> of <white><player></white>."
