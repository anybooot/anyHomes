name: AnyHomes
version: '${project.version}'
main: dev.anyhomes.App
api-version: '1.21'
description: High-End Home Management System
authors: [ AnyHomesDev ]
website: https://anyboot.ct.ws/plugins/anyhomes

depend: [ ]
softdepend: [ LuckPerms, PlaceholderAPI ]

# ─── Commands ────────────────────────────────────────────────────────────────

commands:
  anyhomes:
    description: Main AnyHomes command
    usage: /anyhomes <sethome|home|delhome|list>

  sethome:
    description: Set a home at your current location
    usage: /sethome [name]

  sethomes:
    description: Set a home for a player
    usage: /sethomes <player>:<home>

  home:
    description: Teleport to a saved home
    usage: /home [name]

  delhome:
    description: Delete a saved home
    usage: /delhome <name>

  delhomes:
    description: Delete a home for a player
    usage: /delhomes <player>:<home>

  homes:
    description: List your homes or manage other player's homes
    usage: /homes [player:home]

# ─── Permissions ─────────────────────────────────────────────────────────────

permissions:

  anyhomes.*:
    description: Full access to all AnyHomes features
    default: op
    children:
      anyhomes.use: true
      anyhomes.sethome: true
      anyhomes.home: true
      anyhomes.rename: true
      anyhomes.delhome: true
      anyhomes.list: true
      anyhomes.admin: true
      anyhomes.bypass.cooldown: true
      anyhomes.bypass.warmup: true
      anyhomes.bypass.limit: true

  anyhomes.use:
    description: Access to the base /anyhomes command
    default: true

  anyhomes.sethome:
    description: Allow setting homes
    default: true

  anyhomes.home:
    description: Allow teleporting to homes
    default: true

  anyhomes.rename:
    description: Allow renaming homes from the GUI
    default: true

  anyhomes.delhome:
    description: Allow deleting homes
    default: true

  anyhomes.list:
    description: Allow listing homes
    default: true

  anyhomes.admin:
    description: Allow admin sub-commands (reload, force-delhome)
    default: op

  anyhomes.bypass.cooldown:
    description: Bypass the teleport cooldown
    default: op

  anyhomes.bypass.warmup:
    description: Bypass the warmup countdown
    default: op

  anyhomes.bypass.limit:
    description: Bypass the home limit (unlimited homes)
    default: op
