# ╔═══════════════════════════════════════════════════════════════════════════╗
# ║                       AnyHomes — config.yml Tutorial                      ║
# ╚═══════════════════════════════════════════════════════════════════════════╝
#
# Welcome to the AnyHomes main configuration!
# Below is a detailed guide explaining how to customize the plugin.
#
# ─── Color Formatting ──────────────────────────────────────────────────────
# You can use standard formatting codes like & or §, raw hex like #ffffff,
# and Adventure MiniMessage gradients:
#   Examples:
#     - "&aGreen Text"
#     - "#a855f7Purple Text"
#     - "<gradient:#a855f7:#06b6d4><bold>Gradient Text</bold></gradient>"
#
# ─── Permissions ───────────────────────────────────────────────────────────
# Change these values to customize the permission nodes required for commands:
#   - use: Permission to use the main /anyhomes command.
#   - sethome: Permission to save a home (/sethome).
#   - sethomes: Permission to set another player's home (/sethomes).
#   - home: Permission to teleport to a home (/home).
#   - delhome: Permission to delete a home (/delhome).
#   - delhomes: Permission to delete another player's home (/delhomes).
#   - list: Permission to list homes (/homes).
#   - admin: Permission to manage other players' homes and reload configurations.
#
# ─── Bypass Permissions ─────────────────────────────────────────────────────
# Players with these permissions will bypass limitations:
#   - limit: Bypass the home limit (allows unlimited homes).
#   - cooldown: Bypass the teleport cooldown timer.
#   - warmup: Bypass the standby warmup countdown timer.
#
# ╔═══════════════════════════════════════════════════════════════════════════╗

# ─── Database ────────────────────────────────────────────────────────────────
database:
  # Storage type: "sqlite" (local file) or "mysql" (remote server)
  type: sqlite

  mysql:
    host: localhost
    port: 3306
    database: anyhomes
    user: root
    password: ''
    ssl: false
    # Maximum number of connections in the HikariCP pool
    pool-size: 10

# ─── Homes ───────────────────────────────────────────────────────────────────
homes:
  # Default home limit when LuckPerms meta-key "home-limit" is not set.
  # Set via LuckPerms: /lp user <name> meta set home-limit 10
  default-limit: 3

  # Whether home names are case-insensitive (stored lowercase)
  case-insensitive: true

  # Regex pattern for valid home names
  name-pattern: "[a-zA-Z0-9_-]{1,32}"

# ─── Teleport ────────────────────────────────────────────────────────────────
teleport:
  # Warmup countdown (seconds) before teleportation. Set to 0 to disable.
  # Bypass permission: anyhomes.bypass.warmup
  warmup-seconds: 3

  # Cooldown (seconds) between teleportations. Set to 0 to disable.
  # Bypass permission: anyhomes.bypass.cooldown
  cooldown-seconds: 30

  # Maximum allowed movement (blocks) during warmup before cancellation.
  # This is horizontal (XZ) distance only.
  move-cancel-threshold: 0.3

# ─── GUI ─────────────────────────────────────────────────────────────────────
gui:
  # Open a GUI for /homes instead of printing a text list
  homes-list-enabled: true

  # Home menu pagination settings
  homes-menu:
    # Enable pagination when there are more homes than available slots
    pagination-enabled: true
    
    # Show page number in title (e.g., <1/5>) when pagination is enabled
    show-page-indicator: true
    
    # Page indicator format: use <page> for current page and <max> for max pages
    page-indicator-format: " <page>/<max>"

# ─── Dynamic Permissions ─────────────────────────────────────────────────────
permissions:
  # Permission to use the main command
  use: "anyhomes.use"

  # Sub-command permissions
  sethome: "anyhomes.sethome"
  sethomes: "anyhomes.sethomes"
  home: "anyhomes.home"
  delhome: "anyhomes.delhome"
  delhomes: "anyhomes.delhomes"
  rename: "anyhomes.rename"
  list: "anyhomes.list"
  admin: "anyhomes.admin"

  # Bypass permissions
  bypass:
    limit: "anyhomes.bypass.limit"
    cooldown: "anyhomes.bypass.cooldown"
    warmup: "anyhomes.bypass.warmup"
