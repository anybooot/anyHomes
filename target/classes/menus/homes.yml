# ╔═══════════════════════════════════════════════════════════════════════════╗
# ║                            AnyHomes Menu Layout                           ║
# ╚═══════════════════════════════════════════════════════════════════════════╗
#
# This file configures the homes menu layout.
#
# ─── Internal Placeholders ─────────────────────────────────────────────────
#   <home>    - The display name of the home
#   <world>   - The world name where the home is located
#   <coords>  - Formatted coordinates (x, y, z)
#   <count>   - Number of homes the player has
#   <max>     - Maximum number of homes allowed (or ∞ if unlimited)
#
# ╔═══════════════════════════════════════════════════════════════════════════╗

title: "<reset><gradient:#ff5f6d:#ffc371><bold>✦ Homes Hub ✦</bold></gradient>"
rows: 5

home-slots:
  - 20
  - 21
  - 22
  - 23
  - 24

homes-start-slot: 11

filler:
  enabled: true
  material: GRAY_STAINED_GLASS_PANE
  hide-details: true
  item_flags:
    - HIDE_ADDITIONAL_TOOLTIP

items:
  header:
    slot: 4
    material: PLAYER_HEAD
    base64: "eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZi5uZXQvdGV4dHVyZS8zMGI1YzUyYjM0MTc0OGI3M2U0NDI0NzcyN2NjZDFkZGIwZjViNzA4NjY3YzBjZDE5MzhlZjY4NzI4YjYifX19"
    display-name: "<reset><gradient:#ff5f6d:#ffc371><bold>✦ Your Residences ✦</bold></gradient>"
    lore:
      - "<reset><gray>Welcome to your teleportation hub."
      - "<reset><gray>Manage your locations and teleport instantly."
      - "<reset>"
      - "<reset><gray>Active Homes: <gradient:#ff5f6d:#ffc371><count>/<max></gradient>"
    hide-details: false
    item_flags:
      - HIDE_ADDITIONAL_TOOLTIP
    action: NONE

  rename_info:
    slot: 38
    material: WRITABLE_BOOK
    display-name: "<reset><gradient:#ff5f6d:#ffc371><bold>Rename Guide</bold></gradient>"
    lore:
      - "<reset><gray>Middle-click any home icon to rename."
      - "<reset><dark_gray>Follow the prompt in chat."
    action: NONE

  help:
    slot: 42
    material: COMPASS
    display-name: "<reset><gradient:#ff5f6d:#ffc371><bold>Help & Commands</bold></gradient>"
    lore:
      - "<reset><gray>Click to view commands and permissions."
    action: OPEN_HELP

  close:
    slot: 40
    material: REDSTONE
    display-name: "<reset><#ff5f6d><bold>Close Menu</bold></#ff5f6d>"
    lore:
      - "<reset><gray>Return to game."
    action: CLOSE

  previous_page:
    slot: 36
    material: ARROW
    display-name: "<reset><gradient:#ff5f6d:#ffc371><bold>← Previous Page</bold></gradient>"
    lore:
      - "<reset><gray>Click to page left."
      - "<reset><dark_gray>Current: <page>/<max>"
    action: PREVIOUS_PAGE

  next_page:
    slot: 44
    material: ARROW
    display-name: "<reset><gradient:#ff5f6d:#ffc371><bold>Next Page →</bold></gradient>"
    lore:
      - "<reset><gray>Click to page right."
      - "<reset><dark_gray>Current: <page>/<max>"
    action: NEXT_PAGE

home-item:
  material: ORANGE_BED
  base64: ""
  display-mode: BOTH
  hide-details: false
  item_flags:
    - HIDE_ADDITIONAL_TOOLTIP
  display-name: "<reset><gradient:#ff5f6d:#ffc371><bold><home></bold></gradient>"
  lore:
    - "<reset>"
    - "<reset><dark_gray>World: <white><world>"
    - "<reset><dark_gray>Location: <white><coords>"
    - "<reset>"
    - "<reset><gradient:#ff5f6d:#ffc371>Left-Click</gradient> <gray>to teleport"
    - "<reset><gradient:#ff5f6d:#ffc371>Middle-Click</gradient> <gray>to rename"
    - "<reset><#ff5f6d>Right-Click</#ff5f6d> <gray>to delete"
