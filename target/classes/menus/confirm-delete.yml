# ╔═══════════════════════════════════════════════════════════════════════════╗
# ║                      AnyHomes Confirm Delete Layout                       ║
# ╚═══════════════════════════════════════════════════════════════════════════╗
#
# This file configures the confirm-delete menu layout.
#
# ╔═══════════════════════════════════════════════════════════════════════════╗

title: "<reset><#ff5f6d><bold>Confirm Deletion</bold></#ff5f6d>"
rows: 3

filler:
  enabled: true
  material: GRAY_STAINED_GLASS_PANE
  hide-details: true
  item_flags:
    - HIDE_ADDITIONAL_TOOLTIP

items:
  warning:
    slot: 13
    material: LAVA_BUCKET
    item_flags:
      - HIDE_ADDITIONAL_TOOLTIP
    display-name: "<reset><gradient:#ff5f6d:#ffc371><bold>Warning!</bold></gradient>"
    lore:
      - "<reset><gray>You are about to delete <gradient:#ff5f6d:#ffc371><home></gradient>."
      - "<reset><dark_gray>Located in: <white><world>"
      - "<reset><dark_gray>Coordinates: <white><coords>"
      - "<reset>"
      - "<reset><#ff5f6d>This action is permanent and cannot be undone!</#ff5f6d>"
    action: NONE

  confirm:
    slot: 11
    material: GREEN_TERRACOTTA
    display-name: "<reset><green><bold>✔ Yes, Delete</bold></green>"
    lore:
      - "<reset><gray>Delete the home forever."
    action: CONFIRM_DELETE

  cancel:
    slot: 15
    material: RED_TERRACOTTA
    display-name: "<reset><#ff5f6d><bold>✘ No, Cancel</bold></#ff5f6d>"
    lore:
      - "<reset><gray>Return safely to homes."
    action: CANCEL
